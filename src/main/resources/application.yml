spring:
  application:
    name: pix-poc

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pix}
    username: ${SPRING_DATASOURCE_USERNAME:pix}
    password: ${SPRING_DATASOURCE_PASSWORD:pix}
    hikari:
      # Pool mantido explicito: sera a variavel de backpressure observada nas fatias 006/007.
      # Igual entre configs platform/virtual para nao contaminar o benchmark (constitution P3).
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      pool-name: pix-hikari

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # Toggle HTTP do benchmark (fatia 007). Default OFF = baseline platform threads.
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}

server:
  port: 8080
  # Pool Tomcat = 200 no modo baseline (platform). Referencia explicita para a fatia 007.
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    rabbit:
      enabled: true
  metrics:
    distribution:
      # Habilita buckets de histograma para calcular p50/p95/p99 no Prometheus/Grafana.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s

# ===== Autorizador SPI (fatia 003) =====
autorizador:
  spi:
    url: ${AUTORIZADOR_SPI_URL:http://localhost:8081/spi/autorizar}

# ===== Resiliencia da chamada ao SPI (fatia 003) =====
resilience4j:
  retry:
    instances:
      spi:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - br.com.poc.pix.domain.AutorizadorIndisponivelException
  circuitbreaker:
    instances:
      spi:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        # NAO registrar health indicator: um CB aberto na rodada de caos nao pode
        # derrubar o /actuator/health (senao o container ficaria unhealthy).
        register-health-indicator: false

# ===== Toggles do consumer (eixo do benchmark - fatia 007) =====
benchmark:
  # Rotulo aplicado a todas as metricas (tag benchmark_mode) para comparar as rodadas no Grafana.
  mode: ${BENCHMARK_MODE:platform}
  consumer:
    mode: ${BENCHMARK_CONSUMER_MODE:platform}
    concurrency: ${BENCHMARK_CONSUMER_CONCURRENCY:20}
